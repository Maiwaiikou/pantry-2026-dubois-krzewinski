include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - build/**
    - android/**
    - web/**
    - ios/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    # Un projet de cours n'est pas une bibliothèque publiée : on n'exige pas
    # une doc sur chaque membre public.
    public_member_api_docs: false
    # Les chaînes affichées sont en français et resteront en dur jusqu'à la
    # séance 10, qui introduit l'internationalisation.
    lines_longer_than_80_chars: false
    # Les dépendances suivent l'ordre dans lequel `flutter pub add` les ajoute,
    # séance après séance.
    sort_pub_dependencies: false
